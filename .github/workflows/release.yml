name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Set version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          sed -i '' "s#public static let current = \".*\"#public static let current = \"${VERSION_NO_V}\"#g" Sources/SweetDeckDomain/Version.swift
      - name: Build
        run: swift build -c release
      - name: Package
        run: |
          mkdir -p dist
          cp .build/release/sweetdeck dist/sweetdeck
          (cd dist && zip -r sweetdeck-${{ github.ref_name }}-macos.zip sweetdeck)
          shasum -a 256 dist/sweetdeck-${{ github.ref_name }}-macos.zip > dist/sweetdeck-${{ github.ref_name }}-macos.zip.sha256
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
      - name: Generate Homebrew formula
        run: |
          ZIP="dist/sweetdeck-${{ github.ref_name }}-macos.zip"
          SHA=$(cut -d " " -f1 "${ZIP}.sha256")
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"

          cp Formula/sweetdeck.rb.template Formula/sweetdeck.rb
          sed -i '' "s#REPLACE_OWNER#${OWNER}#g" Formula/sweetdeck.rb
          sed -i '' "s#REPLACE_REPO#${REPO}#g" Formula/sweetdeck.rb
          sed -i '' "s#v__VERSION__#${VERSION}#g" Formula/sweetdeck.rb
          sed -i '' "s#__SHA256__#${SHA}#g" Formula/sweetdeck.rb
          sed -i '' "s#__VERSION_NO_V__#${VERSION_NO_V}#g" Formula/sweetdeck.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Do not commit the generated formula back to this repo.
      - name: Push formula to tap repo
        env:
          TAP_REPO: leon-wolf/homebrew-sweetdeck
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Missing HOMEBREW_TAP_TOKEN secret. Create a fine-grained PAT with Contents: Read and write on ${TAP_REPO} and add it as a repo secret."
            exit 1
          fi
          git clone https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp Formula/sweetdeck.rb /tmp/tap/Formula/sweetdeck.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sweetdeck.rb
          git commit -m "Update sweetdeck formula for ${{ github.ref_name }}" || true
          git push
