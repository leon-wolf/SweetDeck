name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build
        run: swift build -c release
      - name: Package
        run: |
          mkdir -p dist
          cp .build/release/sweetdeck dist/sweetdeck
          (cd dist && zip -r sweetdeck-${{ github.ref_name }}-macos.zip sweetdeck)
          shasum -a 256 dist/sweetdeck-${{ github.ref_name }}-macos.zip > dist/sweetdeck-${{ github.ref_name }}-macos.zip.sha256
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
      - name: Update Homebrew formula
        run: |
          ZIP="dist/sweetdeck-${{ github.ref_name }}-macos.zip"
          SHA=$(cut -d " " -f1 "${ZIP}.sha256")
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"

          sed -i '' "s#https://github.com/REPLACE_OWNER/REPLACE_REPO#https://github.com/${OWNER}/${REPO}#g" Formula/sweetdeck.rb
          sed -i '' "s#https://github.com/REPLACE_OWNER/REPLACE_REPO/releases/download/v[0-9.]\\+/sweetdeck-v[0-9.]+-macos.zip#https://github.com/${OWNER}/${REPO}/releases/download/${VERSION}/sweetdeck-${VERSION}-macos.zip#g" Formula/sweetdeck.rb
          sed -i '' "s#sha256 \".*\"#sha256 \"${SHA}\"#g" Formula/sweetdeck.rb
          sed -i '' "s#version \".*\"#version \"${VERSION_NO_V}\"#g" Formula/sweetdeck.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sweetdeck.rb
          git commit -m "chore: update formula for ${VERSION}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
